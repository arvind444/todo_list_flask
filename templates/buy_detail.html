{% extends 'base.html' %}
{% block header_title %}ITEM DETAILS{% endblock %}

{% block content %}
{% if item.is_overdue %}
    <div class="alert alert-error" style="font-weight: bold;">
        ⚠️ This item has not met the deadline!
    </div>
{% endif %}

<form method="POST">
    <div class="form-group">
        <label>Item Name</label>
        <input type="text" name="title" value="{{ item.title }}" required>
    </div>
    
    <div class="form-group">
        <label>When will it be completed?</label>
        <input type="date" name="due_date" value="{{ item.due_date.strftime('%Y-%m-%d') if item.due_date else '' }}">
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
            <label>Quantity</label>
            <input type="number" name="quantity" value="{{ item.quantity }}" min="1">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Price ($)</label>
            <input type="number" step="0.01" name="estimated_price" value="{{ item.estimated_price }}">
        </div>
    </div>

    <div class="form-group">
        <label>Store / Brand</label>
        <input type="text" name="store" value="{{ item.store or '' }}">
    </div>

    <div class="form-group">
        <label>Notes</label>
        <textarea name="description">{{ item.description or '' }}</textarea>
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
        <input type="checkbox" name="is_completed" id="completed" {% if item.is_completed %}checked{% endif %} style="width: 18px; height: 18px;">
        <label for="completed" style="margin-bottom: 0;">Mark as purchased</label>
    </div>
    
    <div class="btn-row">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="submit" name="delete" value="true" class="btn btn-danger" onclick="return confirm('Delete this item?');">Delete</button>
        <a href="{{ url_for('buy_list') }}" class="btn btn-secondary">Back</a>
    </div>
</form>
{% endblock %}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <!-- Umbrella Stick & Hook Handle -->
  <line x1="140" y1="25" x2="140" y2="135" stroke="#4a3b32" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 140 130 C 140 148, 126 148, 126 138" fill="none" stroke="#4a3b32" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="140" y1="25" x2="140" y2="14" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>

  <!-- Umbrella Canopy -->
  <path d="M 75 65 C 75 20, 195 20, 195 65 C 175 58, 155 60, 140 65 C 120 58, 95 60, 75 65 Z" 
        fill="#ffffff" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/>
  <!-- Umbrella Ribs -->
  <line x1="140" y1="24" x2="140" y2="65" stroke="#4a3b32" stroke-width="3"/>
  <path d="M 140 24 Q 105 40 100 62" stroke="#4a3b32" stroke-width="3" fill="none"/>
  <path d="M 140 24 Q 170 40 172 62" stroke="#4a3b32" stroke-width="3" fill="none"/>

  <!-- Rain Boots -->
  <rect x="74" y="195" width="16" height="18" rx="4" fill="#8ecae6" stroke="#4a3b32" stroke-width="3.5"/>
  <rect x="104" y="195" width="16" height="18" rx="4" fill="#8ecae6" stroke="#4a3b32" stroke-width="3.5"/>

  <!-- Raincoat Body -->
  <path d="M 60 150 L 72 135 L 122 135 L 134 150 L 126 195 L 68 195 Z" 
        fill="#ffd152" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/>
  <!-- Coat Center Seam & Snaps -->
  <line x1="97" y1="135" x2="97" y2="195" stroke="#4a3b32" stroke-width="3.5"/>
  <circle cx="92" cy="150" r="2.5" fill="#4a3b32"/>
  <circle cx="92" cy="168" r="2.5" fill="#4a3b32"/>
  <circle cx="92" cy="186" r="2.5" fill="#4a3b32"/>

  <!-- Raincoat Hood Outer -->
  <circle cx="97" cy="110" r="40" fill="#ffd152" stroke="#4a3b32" stroke-width="4"/>

  <!-- Penguin Head / Face -->
  <ellipse cx="97" cy="113" rx="28" ry="26" fill="#2d3142" stroke="#4a3b32" stroke-width="3"/>
  <!-- White Face Patch -->
  <path d="M 80 126 C 76 100, 97 100, 97 114 C 97 100, 118 100, 114 126 Z" fill="#ffffff"/>

  <!-- Eyes -->
  <ellipse cx="88" cy="114" rx="2.5" ry="3.5" fill="#4a3b32"/>
  <ellipse cx="106" cy="114" rx="2.5" ry="3.5" fill="#4a3b32"/>

  <!-- Cheeks -->
  <ellipse cx="82" cy="122" rx="4.5" ry="2.5" fill="#ffb4a2"/>
  <ellipse cx="112" cy="122" rx="4.5" ry="2.5" fill="#ffb4a2"/>

  <!-- Orange Beak -->
  <polygon points="93,118 101,118 97,126" fill="#ff9933" stroke="#4a3b32" stroke-width="2"/>

  <!-- Hand Holding Umbrella -->
  <circle cx="138" cy="136" r="7" fill="#ffd152" stroke="#4a3b32" stroke-width="3.5"/>
</svg>
